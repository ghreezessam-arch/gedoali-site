<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>gedoali — الحق البيض</title>
<meta name="theme-color" content="#0F2E1E">
<meta name="description" content="لعبة جدو علي: الحق البيض في السلة قبل ما يقع!">
<meta property="og:title" content="الحق البيض مع جدو علي">
<meta property="og:description" content="لعبة خفيفة من جدو علي — كل ما تكسب، البيض بيقع أسرع.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--forest:#0F2E1E;--forest2:#173F2A;--lime:#88C441;--cream:#F2EEE4}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--forest);color:#fff;font-family:"Readex Pro",Tahoma,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
.hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:2}
.hud .sc{font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.hud .lv{font-size:13px;color:var(--lime);font-weight:500;margin-top:4px}
.hud .lives{display:flex;gap:6px;direction:ltr}
.hud .lives i{width:16px;height:21px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--cream);display:block;transition:opacity .3s,transform .3s}
.hud .lives i.off{opacity:.18;transform:scale(.8)}
.mute{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:14px;z-index:3;background:rgba(255,255,255,.08);border:0;color:#fff;width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer}
.scr{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px calc(32px + env(safe-area-inset-bottom,0px));background:rgba(15,46,30,.94)}
.scr.on{display:flex}
.scr svg{width:min(120px,30vw);height:auto;fill:var(--lime)}
.scr h1{margin-top:20px;font-size:clamp(40px,11vw,58px);font-weight:700;color:var(--lime);line-height:1.1}
.scr p{margin-top:12px;font-size:17px;line-height:1.7;color:rgba(255,255,255,.8);max-width:30ch}
.scr .big{font-size:72px;font-weight:700;line-height:1;margin-top:14px;font-variant-numeric:tabular-nums}
.scr .best{margin-top:6px;font-size:15px;color:var(--lime)}
.btn{margin-top:28px;border:0;border-radius:16px;background:var(--lime);color:var(--forest);font:inherit;font-weight:700;font-size:20px;padding:16px 44px;cursor:pointer;min-width:220px}
.btn.ghost{margin-top:12px;background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.3);font-weight:500;font-size:17px;padding:13px 30px;text-decoration:none;display:inline-block}
.how{margin-top:18px;font-size:13px;color:rgba(255,255,255,.55)}
.toast{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%) scale(.8);z-index:4;font-weight:700;font-size:clamp(34px,10vw,52px);color:var(--lime);opacity:0;pointer-events:none;transition:opacity .25s,transform .35s cubic-bezier(.2,.8,.2,1);white-space:nowrap;text-shadow:0 6px 24px rgba(0,0,0,.35)}
.form{margin-top:18px;width:100%;max-width:340px;display:grid;gap:10px;text-align:right}
.form input,.form select{width:100%;font:inherit;font-size:17px;color:#fff;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.18);border-radius:14px;padding:13px 14px;outline:none;appearance:none;-webkit-appearance:none}
.form select option{color:#0F2E1E}
.form input:focus,.form select:focus{border-color:var(--lime)}
.form input.ph{direction:ltr;text-align:right;letter-spacing:.04em}
.form label.ck{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.6;color:rgba(255,255,255,.75);cursor:pointer}
.form label.ck input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:#88C441;appearance:auto;-webkit-appearance:auto}
.err{min-height:20px;font-size:14px;color:#F0907E;margin-top:4px}
.me{margin-top:14px;font-size:15px;color:rgba(255,255,255,.8)}.me b{color:var(--lime)}
.me button{background:none;border:0;color:rgba(255,255,255,.55);font:inherit;font-size:13px;text-decoration:underline;margin-inline-start:8px;cursor:pointer}
.lb{margin-top:20px;width:100%;max-width:300px;font-size:14px}
.lb h3{font-size:13px;font-weight:500;color:var(--lime);letter-spacing:.04em;margin-bottom:6px}
.lb ol{list-style:none;display:grid;gap:4px}
.lb li{display:flex;justify-content:space-between;padding:6px 12px;border-radius:10px;background:rgba(255,255,255,.05)}
.lb li b{color:var(--lime);font-variant-numeric:tabular-nums}
.saved{margin-top:8px;font-size:13px;color:var(--lime);min-height:18px}
.scr.tall{justify-content:flex-start;overflow-y:auto;padding-top:calc(36px + env(safe-area-inset-top,0px))}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="hud" style="display:none"><div><div class="sc" id="sc">0</div><div class="lv" id="lv">المرحلة ١</div></div><div class="lives" id="lives"><i></i><i></i><i></i></div></div>
<button class="mute" id="mute" aria-label="الصوت">🔊</button>
<div class="toast" id="toast"></div>

<section class="scr on tall" id="s-start">

  <p>جدو علي بيرمي البيض من فوق — امسكه في السلة قبل ما يقع. كل ما تعدّي مرحلة البيض بيقع أسرع.</p>
  <div class="form" id="reg">
    <input id="f-name" placeholder="اسمك" autocomplete="name" maxlength="40">
    <input id="f-phone" class="ph" placeholder="رقم الموبايل" inputmode="tel" autocomplete="tel" maxlength="14">
    <select id="f-area"><option value="">منطقتك</option></select>
    <label class="ck"><input type="checkbox" id="f-opt"> ابعتولي عروض جدو علي على واتساب</label>
    <div class="err" id="f-err"></div>
  </div>
  <div class="me" id="me" style="display:none">بتلعب باسم <b id="me-n"></b><button id="me-x">مش أنا</button></div>
  <button class="btn" id="b-start">يلا نلعب</button>
  <div class="how">اسحب بصباعك أو حرّك الماوس · الأسهم على الكيبورد</div>
  <div class="lb" id="lb1"></div>
</section>

<section class="scr" id="s-over">
  <svg viewBox="0 0 554 752" aria-hidden="true"><path class="mp" fill-rule="evenodd"/></svg>
  <p id="o-msg">الحق! البيض وقع</p>
  <div class="big" id="o-sc">0</div>
  <div class="best" id="o-best"></div>
  <div class="saved" id="o-saved"></div>
  <button class="btn" id="b-again">العب تاني</button>
  <a class="btn ghost" href="/order">اطلب بيض بجد من جدو علي</a>
  <div class="lb" id="lb2"></div>
</section>

  player={name,phone,area,optin:$('f-opt').checked};try{localStorage.setItem('gedo_player',JSON.stringify(player))}catch(e){};return null}
function renderTop(top){const h=top&&top.length?'<h3>أعلى ٥ نتايج</h3><ol>'+top.map((t,i)=>'<li><span>'+AR(i+1)+'. '+String(t.n).replace(/[<&>]/g,'')+'</span><b>'+AR(t.s)+'</b></li>').join('')+'</ol>':'';$('lb1').innerHTML=h;$('lb2').innerHTML=h;}
function loadTop(){fetch(API+'?game=top').then(r=>r.json()).then(d=>{renderTop(d.top);const s=$('f-area');if(d.areas&&s.options.length<2){d.areas.forEach(a=>{const o=document.createElement('option');o.value=o.textContent=a;s.appendChild(o)});const o=document.createElement('option');o.value='منطقة تانية';o.textContent='منطقة تانية';s.appendChild(o);}}).catch(()=>{const s=$('f-area');if(s.options.length<2){['المعادي','زهراء المعادي','القطامية','المقطم','مدينة نصر','مصر الجديدة','التجمع','الرحاب','مدينتي','الشروق','منطقة تانية'].forEach(a=>{const o=document.createElement('option');o.value=o.textContent=a;s.appendChild(o)})}});}
function submit(){if(!player)return;$('o-saved').textContent='بنسجّل نتيجتك…';
  fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'game',name:player.name,phone:player.phone,area:player.area,optin:player.optin,score,level,secs:Math.round((performance.now()-t0)/1000)})})
   .then(()=>{$('o-saved').textContent='✓ نتيجتك اتسجلت باسم '+player.name;setTimeout(loadTop,1500)}).catch(()=>{$('o-saved').textContent='ماقدرناش نسجّل النتيجة — اتأكد من النت'});}

function speed(){return 150+ (level-1)*48}              // px/s fall speed
function interval(){return Math.max(.38,1.25-(level-1)*.09)} // s between eggs
function reset(){basket={x:W/2,y:H-basketBottom(),w:Math.min(150,W*.36),tx:W/2};eggs=[];fx=[];score=0;caught=0;level=1;lives=3;spawnT=.6;paintHud();}
function paintHud(){$('sc').textContent=AR(score);$('lv').textContent='المرحلة '+AR(level);[...$('lives').children].forEach((n,i)=>n.classList.toggle('off',i>=lives));}
function toast(t){const n=$('toast');n.textContent=t;n.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>n.classList.remove('on'),1100);}
function spawn(){const r=Math.max(15,Math.min(20,W*.045));const gold=level>=2&&Math.random()<.08;const t=EGGS[(Math.random()*3)|0];eggs.push({x:r+Math.random()*(W-2*r),y:-r*1.4,r,vy:speed()*(.9+Math.random()*.25),rot:(Math.random()-.5)*.6,vr:(Math.random()-.5)*1.5,gold,t});}

/* ---------- input ---------- */
function setX(px){if(basket)basket.tx=px;}
cv.addEventListener('pointerdown',e=>setX(e.clientX));
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons||e.pointerType==='touch')setX(e.clientX)});
const keys={};addEventListener('keydown',e=>{keys[e.key]=1;if(e.key==='Enter'&&state!=='play'){e.preventDefault();start();}});addEventListener('keyup',e=>keys[e.key]=0);

/* ---------- draw ---------- */
function drawBg(){cx.fillStyle='#0F2E1E';cx.fillRect(0,0,W,H);
  cx.save();cx.globalAlpha=.05;cx.fillStyle='#88C441';const s=Math.max(W,H)*.9/752;cx.translate(W-554*s*.55,H-752*s*.85);cx.scale(s,s);cx.fill(MASCOT,'evenodd');cx.restore();
  // ground line
  cx.fillStyle='rgba(255,255,255,.06)';cx.fillRect(0,H-basketBottom()+46,W,2);}
function eggPath(r){cx.beginPath();cx.ellipse(0,0,r*.78,r,0,0,Math.PI*2);}
function drawEgg(e){cx.save();cx.translate(e.x,e.y);cx.rotate(e.rot);
  if(e.gold){cx.shadowColor='rgba(240,200,60,.8)';cx.shadowBlur=18;}
  eggPath(e.r);const g=cx.createRadialGradient(-e.r*.3,-e.r*.45,e.r*.1,0,0,e.r*1.1);
  if(e.gold){g.addColorStop(0,'#FFF3B0');g.addColorStop(.6,'#F2C53D');g.addColorStop(1,'#C9961A');}
  else{g.addColorStop(0,'#fff');g.addColorStop(.35,e.t.c);g.addColorStop(1,e.t.s);}
  cx.fillStyle=g;cx.fill();cx.restore();}
function drawBasket(){const b=basket,w=b.w,h=w*.46,x=b.x-w/2,y=b.y-h*.2;
  cx.save();
  // shadow
  cx.fillStyle='rgba(0,0,0,.25)';cx.beginPath();cx.ellipse(b.x,y+h+6,w*.48,8,0,0,Math.PI*2);cx.fill();
  // body
  cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+w,y);cx.lineTo(x+w*.88,y+h);cx.quadraticCurveTo(b.x,y+h+10,x+w*.12,y+h);cx.closePath();
  const g=cx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'#9BD350');g.addColorStop(1,'#6FA834');cx.fillStyle=g;cx.fill();
  // weave
  cx.save();cx.clip();cx.strokeStyle='rgba(15,46,30,.22)';cx.lineWidth=2;
  for(let i=1;i<4;i++){const yy=y+h*i/4;cx.beginPath();cx.moveTo(x,yy);cx.lineTo(x+w,yy);cx.stroke();}
  for(let i=-2;i<14;i++){const xx=x+i*w/11;cx.beginPath();cx.moveTo(xx,y);cx.lineTo(xx+w*.06,y+h);cx.stroke();}
  cx.restore();
  // rim
  cx.fillStyle='#0F2E1E';cx.globalAlpha=.25;cx.fillRect(x-4,y-2,w+8,4);cx.globalAlpha=1;
  cx.fillStyle='#B6E07A';cx.beginPath();cx.roundRect?cx.roundRect(x-6,y-8,w+12,12,6):cx.rect(x-6,y-8,w+12,12);cx.fill();
  // badge (mascot)
  const bs=h*.62;cx.save();cx.translate(b.x-bs*554/752/2,y+h*.22);cx.scale(bs/752,bs/752);cx.fillStyle='#0F2E1E';cx.fill(MASCOT,'evenodd');cx.restore();
  cx.restore();}
function drawFx(dt){fx=fx.filter(f=>(f.t+=dt)<f.d);fx.forEach(f=>{const k=f.t/f.d;cx.save();cx.globalAlpha=1-k;
  if(f.k==='splat'){cx.translate(f.x,f.y);cx.fillStyle='#F7F3E8';cx.beginPath();for(let i=0;i<9;i++){const a=i/9*Math.PI*2,rr=f.r*(1.2+((i%2)?.5:0))*(.6+k*.6);cx.lineTo(Math.cos(a)*rr*1.4,Math.sin(a)*rr*.45);}cx.closePath();cx.fill();cx.fillStyle='#F5B82E';cx.beginPath();cx.ellipse(0,-2,f.r*.45,f.r*.3,0,0,Math.PI*2);cx.fill();}
  if(f.k==='plus'){cx.fillStyle=f.gold?'#F2C53D':'#88C441';cx.font='700 '+(f.gold?28:22)+'px "Readex Pro",sans-serif';cx.textAlign='center';cx.direction='ltr';cx.fillText(f.txt,f.x,f.y-k*40);}
  cx.restore();});}

/* ---------- loop ---------- */
function step(ts){const dt=Math.min(.033,(ts-(last||ts))/1000);last=ts;
  if(state==='play'){
    if(keys.ArrowLeft)basket.tx-=700*dt; if(keys.ArrowRight)basket.tx+=700*dt;
    basket.tx=Math.min(Math.max(basket.tx,basket.w/2),W-basket.w/2);
    basket.x+=(basket.tx-basket.x)*Math.min(1,dt*18);
    spawnT-=dt; if(spawnT<=0){spawn();spawnT=interval()*(.75+Math.random()*.5);}
    const top=basket.y-basket.w*.46*.2, half=basket.w/2;
    eggs.forEach(e=>{e.vy+=40*dt;e.y+=e.vy*dt;e.rot+=e.vr*dt;
      if(!e.done&&e.y+e.r*.6>=top&&e.y-e.r<top+14&&Math.abs(e.x-basket.x)<half-4){e.done=1;const pts=e.gold?5:1;score+=pts;caught++;fx.push({k:'plus',x:e.x,y:top-10,t:0,d:.7,txt:'+'+AR(pts),gold:e.gold});e.gold?sGold():sCatch();
        if(caught%PER_LEVEL===0){level++;sLevel();toast('المرحلة '+AR(level));}paintHud();}
      else if(!e.done&&e.y-e.r>H-basketBottom()+46){e.done=1;lives--;fx.push({k:'splat',x:e.x,y:H-basketBottom()+46,r:e.r,t:0,d:1.2});sBreak();shake=.25;try{navigator.vibrate&&navigator.vibrate(60)}catch(_){}paintHud();if(lives<=0)over();}
    });
    eggs=eggs.filter(e=>!e.done);
  }
  cx.save();if(shake>0){shake-=dt;cx.translate((Math.random()-.5)*8,(Math.random()-.5)*6);}
  drawBg();eggs.forEach(drawEgg);drawFx(dt);if(basket)drawBasket();cx.restore();
  requestAnimationFrame(step);}

function start(){if(state==='play')return;if(!player){const er=readForm();$('f-err').textContent=er||'';if(er)return;showMe();}t0=performance.now();try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume()}catch(e){}
  reset();state='play';$('s-start').classList.remove('on');$('s-over').classList.remove('on');$('hud').style.display='flex';toast('المرحلة ١');}
function over(){state='over';const nb=score>best;if(nb){best=score;try{localStorage.setItem('gedo_best',best)}catch(e){}}
  $('o-sc').textContent=AR(score);$('o-best').textContent=nb&&score>0?'رقم قياسي جديد!':'أحسن نتيجة: '+AR(best);
  const msgs=['البيض وقع! جدو علي زعلان شوية','قربت! جرّب تاني','إيدك تتلف في حرير','ده إنت بطل البيض'];
  $('o-msg').textContent=score<10?msgs[0]:score<25?msgs[1]:score<50?msgs[2]:msgs[3];
  submit();
  setTimeout(()=>{$('s-over').classList.add('on');$('hud').style.display='none';},500);}
$('b-start').onclick=start;$('b-again').onclick=start;
addEventListener('resize',resize);resize();reset();showMe();loadTop();requestAnimationFrame(step);
window.__gedo={get state(){return state},get level(){return level},get score(){return score},get lives(){return lives},get eggs(){return eggs},start,force(l){level=l}};
})();
</script>
